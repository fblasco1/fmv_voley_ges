name: Sync fixture FMV Echagüe

on:
  schedule:
    # 08:00 y 20:00 ART (11:00 y 23:00 UTC)
    - cron: "0 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape FMV fixture
        run: python analysis/sync_fixture_echague.py

      - name: Commit JSON/CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/echague/fixture_fmv_voley.json outputs/echague/fixture_fmv_voley.csv
          if git diff --staged --quiet; then
            echo "Sin cambios en fixture"
          else
            git commit -m "chore: sync fixture FMV Echagüe"
            git push
          fi
